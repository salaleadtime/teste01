name: CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'docs/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'test/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install dependencies
        run: npm ci

      - name: Syntax check (docs/app.js — this is what GitHub Pages deploys)
        run: node -c docs/app.js

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: XSS / history regression tests
        run: npm run test:xss
